# ============================================
# UNYX Workspace (Proyecto B) - VPS Global
# ============================================
# PostgreSQL es EXTERNO: contenedor 'postgres-unyx' administrado por el VPS.
# Todos los servicios usan la red externa 'empresa-network'.
#
# Despliegue:
#   docker compose --env-file .env.production up -d --build
#   pnpm migrate:prod   (aplicar migraciones, una sola vez o en CI/CD)
#   pnpm seed:prod      (usuarios iniciales, una sola vez)

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: unyx-backend
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      NODE_ENV: production

      # PostgreSQL del VPS global (contenedor postgres-unyx en empresa-network)
      DATABASE_URL: postgresql://unyx_user:${UNYX_DB_PASSWORD}@postgres-unyx:5432/unyx_workspace

      JWT_SECRET: ${JWT_SECRET}

      CORS_ORIGIN: ${CORS_ORIGIN:-https://workspace.unyxsolutions.com}

      REDIS_URL: redis://redis:6379

      LOG_LEVEL: ${LOG_LEVEL:-info}

      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-10}

    depends_on:
      redis:
        condition: service_started

    networks:
      - empresa-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-UNYX Workspace}
    container_name: unyx-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - empresa-network
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: unyx-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    networks:
      - empresa-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  empresa-network:
    external: true

volumes:
  redis_data:
