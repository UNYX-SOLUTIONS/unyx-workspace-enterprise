# Proxy reverso OPCIONAL (referencia).
# En la configuración actual del VPS, el contenedor unyx-frontend (nginx)
# ya actúa como punto de entrada en el puerto 80 y proxea /api hacia
# unyx-backend:3000 (ver apps/frontend/nginx.conf).
# Usa este archivo solo si prefieres un proxy nginx separado.

server {
    listen 80;
    server_name _;

    client_max_body_size 200M;

    location /api/ {
        proxy_pass http://unyx-backend:3000/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://unyx-frontend:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
